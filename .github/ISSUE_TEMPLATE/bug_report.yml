name: Bug Report
description: Report an issue or unexpected behavior in the transactional harness.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not include any secrets, API keys, or private credentials in this report.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or minimal reproduction to trigger the issue.
      placeholder: |
        1. Execute...
        2. Inspect state/outbox...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Logs
      description: OS version, Node version, and sanitized console/log output.
      placeholder: |
        OS: Windows 11
        Node: v20.x
        Logs:
      render: shell
    validations:
      required: false
