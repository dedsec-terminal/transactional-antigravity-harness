name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Package
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run check

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish package
        run: npm publish
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
